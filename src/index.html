    <script type="text/javascript">


        const pyCode = `
import re
def getWordToken():
    text = "Back in our offices, remembering these stories and analyzing the data, we were both fascinated and confused, struggling to fit what we were hearing and seeing into"
    text = re.split(r'\\s+', text)
    print(text)
    counts = {}  # 新建一个空字典
    pattern = r"[，。！？“”‘’：；·、（）【】]|[,.?!;():/-]|[0-9]|—"
    for item in text:
        if (re.search(pattern, item) is None):
            # item = item.strip()
            item = item.lower()  # 统一小写
            counts[item] = counts.get(item, 0) + 1

    # 排序后输出，字典类型没有顺序，所以要转换为有顺序的列表类型，再用sort()方法排序
    words = list(counts.items())
    # sort()方法配合lambda函数实现根据单词次数对元素进行排序
    words.sort(key=lambda x: x[1], reverse=True)
    for item in words:
        word, count = item  # 返回相对应的键值对
        print(word)


getWordToken()

`
        async function main() {
            let pyodide = await loadPyodide();
            console.log(pyodide.runPython(pyCode));
        }
        main();
    </script>
